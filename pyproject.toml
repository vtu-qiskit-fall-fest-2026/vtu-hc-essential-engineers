[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak"
version = "0.1.0"
description = "Hardware-in-the-loop stress test and drift-robust eavesdropper detector for BB84 QKD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.5",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
qml = ["qiskit-machine-learning"]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
include = ["nirikshak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Load the Linux libgomp workaround before pytest starts capturing output (it may restart the process).
addopts = "-p nirikshak._runtime"
